overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.56.0'
  - '@effect/tsgo-darwin-x64@0.56.0'
  - '@effect/tsgo-linux-arm64@0.56.0'
  - '@effect/tsgo-linux-arm@0.56.0'
  - '@effect/tsgo-linux-x64@0.56.0'
  - '@effect/tsgo-win32-arm64@0.56.0'
  - '@effect/tsgo-win32-x64@0.56.0'
  - '@effect/tsgo@0.56.0'
  - electron@45.0.0

autoInstallPeers: false
peerDependencyRules:
  allowedVersions:
    vite: '*'
