name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
      - run: pnpm exec electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: wenbu-windows
          path: dist/*.exe
          if-no-files-found: error
