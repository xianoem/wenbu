name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
      # electron-builder uploads its files in parallel and each upload creates the release when none exists, which splits them across two drafts.
      - name: Create the draft release
        shell: bash
        run: |
          node scripts/release.ts body "$GITHUB_REF_NAME" > release-body.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Wenbu ${GITHUB_REF_NAME#v}" --notes-file release-body.md
      # The release stays a draft until every file is up, so the updater never sees half a release.
      - run: pnpm exec electron-builder --win --publish always
      - name: Publish the release
        shell: bash
        run: |
          for file in latest.yml "wenbu-${GITHUB_REF_NAME#v}-setup.exe" "wenbu-${GITHUB_REF_NAME#v}-setup.exe.blockmap"; do
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qxF "$file" || { echo "::error::$file is missing from the release"; exit 1; }
          done

          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
